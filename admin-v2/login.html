<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07130f" />
    <title>Connexion - CAG Command Center</title>
    <link rel="stylesheet" href="/admin-v2/app.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="grid-glow"></span>
    </div>

    <main class="app-shell">
      <section class="login-screen" aria-label="Connexion CAG">
        <div class="login-card panel neon-panel">
          <div class="brand-mark">CAG</div>
          <p class="eyebrow">MyBusinessLife command center</p>
          <h1>Connexion</h1>
          <p class="login-copy">Accede au cockpit financier de la salle de jeux : ventes, objectifs, achats, stocks et marges.</p>
          <form id="login-form" class="stack" autocomplete="on">
            <label class="field">
              <span>Utilisateur</span>
              <input id="login-username" type="text" autocomplete="username" required autofocus />
            </label>
            <label class="field">
              <span>Mot de passe</span>
              <input id="login-password" type="password" autocomplete="current-password" required />
            </label>
            <button id="login-submit" class="btn btn-primary btn-wide" type="submit">Entrer dans le cockpit</button>
          </form>
          <p id="login-error" class="form-error" role="alert"></p>
          <p class="login-footnote">Connexion separee du dashboard. Une session valide te renvoie automatiquement vers le cockpit.</p>
        </div>
      </section>
    </main>

    <script src="/admin-v2/login.js" defer></script>
  </body>
</html>
